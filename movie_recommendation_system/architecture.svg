<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Movie Recommendation System Architecture</title>
  <desc id="archDesc">Layered architecture with clear data flow and non-overlapping connectors.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 800 32px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .layer { fill: #ffffff; stroke-width: 1.5; rx: 16; }
      .layerBlue { fill: #eff6ff; stroke: #93c5fd; }
      .layerTeal { fill: #f0fdfa; stroke: #5eead4; }
      .layerAmber { fill: #fffbeb; stroke: #fcd34d; }
      .layerRose { fill: #fff1f2; stroke: #fda4af; }
      .layerLabel { font: 800 12px 'Segoe UI', Arial, sans-serif; fill: #1e3a8a; letter-spacing: 0.1em; }
      .nodeTitle { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .nodeBody { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .connector { fill: none; stroke: #1d4ed8; stroke-width: 2.5; marker-end: url(#arrowHead); }
      .connectorSide { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrowHead); }
    </style>
  </defs>

  <rect width="1520" height="900" fill="url(#bgGrad)"/>
  <text class="title" x="60" y="56">Movie Recommendation System</text>
  <text class="subtitle" x="60" y="84">TF-IDF · KNN · Flask · Poster resolution · Recommendation-aware charts</text>

  <!-- Layer 1: Presentation -->
  <rect class="layer layerBlue" x="48" y="118" width="1424" height="130"/>
  <text class="layerLabel" x="72" y="142">PRESENTATION</text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="162" width="200" height="68" rx="12" fill="#fff" stroke="#bfdbfe"/>
    <text class="nodeTitle" x="106" y="190">Browser UI</text>
    <text class="nodeBody" x="106" y="210">HTML · CSS · JS</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="330" y="162" width="200" height="68" rx="12" fill="#fff" stroke="#bfdbfe"/>
    <text class="nodeTitle" x="346" y="190">Templates</text>
    <text class="nodeBody" x="346" y="210">Home · Details · Metrics</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="570" y="162" width="200" height="68" rx="12" fill="#fff" stroke="#bfdbfe"/>
    <text class="nodeTitle" x="586" y="190">REST APIs</text>
    <text class="nodeBody" x="586" y="210">charts · posters · search</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="810" y="162" width="200" height="68" rx="12" fill="#fff" stroke="#bfdbfe"/>
    <text class="nodeTitle" x="826" y="190">Canvas Charts</text>
    <text class="nodeBody" x="826" y="210">live recommendation graphs</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="1050" y="162" width="200" height="68" rx="12" fill="#fff" stroke="#bfdbfe"/>
    <text class="nodeTitle" x="1066" y="190">Autocomplete</text>
    <text class="nodeBody" x="1066" y="210">movie title suggestions</text>
  </g>

  <!-- Layer 2: Application -->
  <rect class="layer layerTeal" x="48" y="278" width="1424" height="130"/>
  <text class="layerLabel" x="72" y="302">APPLICATION</text>

  <g filter="url(#cardShadow)">
    <rect x="120" y="322" width="230" height="68" rx="12" fill="#fff" stroke="#99f6e4"/>
    <text class="nodeTitle" x="136" y="350">Flask Routes</text>
    <text class="nodeBody" x="136" y="370">ui.py</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="400" y="322" width="260" height="68" rx="12" fill="#fff" stroke="#99f6e4"/>
    <text class="nodeTitle" x="416" y="350">Recommendation Service</text>
    <text class="nodeBody" x="416" y="370">recommender.py</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="710" y="322" width="260" height="68" rx="12" fill="#fff" stroke="#99f6e4"/>
    <text class="nodeTitle" x="726" y="350">Poster Resolver</text>
    <text class="nodeBody" x="726" y="370">poster_service.py</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="1020" y="322" width="260" height="68" rx="12" fill="#fff" stroke="#99f6e4"/>
    <text class="nodeTitle" x="1036" y="350">Evaluation</text>
    <text class="nodeBody" x="1036" y="370">evaluation.py</text>
  </g>

  <!-- Layer 3: ML -->
  <rect class="layer layerAmber" x="48" y="438" width="1424" height="130"/>
  <text class="layerLabel" x="72" y="462">MACHINE LEARNING</text>

  <g filter="url(#cardShadow)">
    <rect x="200" y="482" width="280" height="68" rx="12" fill="#fff" stroke="#fde68a"/>
    <text class="nodeTitle" x="216" y="510">TF-IDF Vectorizer</text>
    <text class="nodeBody" x="216" y="530">text features from metadata</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="540" y="482" width="280" height="68" rx="12" fill="#fff" stroke="#fde68a"/>
    <text class="nodeTitle" x="556" y="510">KNN Model</text>
    <text class="nodeBody" x="556" y="530">cosine similarity · top-N</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="880" y="482" width="280" height="68" rx="12" fill="#fff" stroke="#fde68a"/>
    <text class="nodeTitle" x="896" y="510">Metrics Engine</text>
    <text class="nodeBody" x="896" y="530">accuracy · precision · recall · F1</text>
  </g>

  <!-- Layer 4: Data -->
  <rect class="layer layerRose" x="48" y="598" width="1424" height="130"/>
  <text class="layerLabel" x="72" y="622">DATA</text>

  <g filter="url(#cardShadow)">
    <rect x="140" y="642" width="240" height="68" rx="12" fill="#fff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="156" y="670">movies.csv</text>
    <text class="nodeBody" x="156" y="690">raw catalog</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="430" y="642" width="260" height="68" rx="12" fill="#fff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="446" y="670">Preprocessing</text>
    <text class="nodeBody" x="446" y="690">cleaned_movies.csv</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="740" y="642" width="240" height="68" rx="12" fill="#fff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="756" y="670">poster_cache.json</text>
    <text class="nodeBody" x="756" y="690">resolved poster URLs</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="1030" y="642" width="260" height="68" rx="12" fill="#fff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="1046" y="670">TMDB / Wikipedia</text>
    <text class="nodeBody" x="1046" y="690">original film posters</text>
  </g>

  <!-- Vertical flow connectors (center spine, no overlap) -->
  <path class="connector" d="M190 230 L190 278"/>
  <path class="connector" d="M760 248 L760 278"/>
  <path class="connector" d="M235 390 L235 438"/>
  <path class="connector" d="M680 390 L680 438"/>
  <path class="connector" d="M1150 390 L1150 438"/>
  <path class="connector" d="M260 568 L260 598"/>
  <path class="connector" d="M560 568 L560 598"/>
  <path class="connector" d="M860 568 L860 598"/>

  <!-- Horizontal hand-offs (single lane per row) -->
  <path class="connector" d="M290 196 H330"/>
  <path class="connector" d="M530 196 H570"/>
  <path class="connector" d="M770 196 H810"/>
  <path class="connector" d="M1010 196 H1050"/>
  <path class="connector" d="M350 356 H400"/>
  <path class="connector" d="M660 356 H710"/>
  <path class="connector" d="M970 356 H1020"/>
  <path class="connector" d="M480 516 H540"/>
  <path class="connector" d="M820 516 H880"/>
  <path class="connector" d="M380 676 H430"/>
  <path class="connector" d="M690 676 H740"/>

  <!-- Side paths (dashed, routed outside boxes) -->
  <path class="connectorSide" d="M840 390 C840 420, 980 420, 980 642"/>
  <path class="connectorSide" d="M1160 676 C1280 676, 1280 710, 1160 710"/>

  <text class="subtitle" x="60" y="868">Flow: user search → Flask → KNN recommendations → charts &amp; posters update per selected movie.</text>
</svg>
